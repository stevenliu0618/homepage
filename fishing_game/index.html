<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>悠钓物语 - Yuri Tsuri Monogatari</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: monospace;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            border: 4px solid #4a4a6a;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(74, 144, 164, 0.3);
        }

        #game-canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 960px;
            height: 540px;
        }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .ui-panel {
            position: absolute;
            background: rgba(20, 20, 40, 0.95);
            border: 3px solid #6a6a9a;
            padding: 15px;
            pointer-events: auto;
            display: none;
        }

        .ui-panel.active {
            display: block;
        }

        #hud {
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(20, 20, 40, 0.85);
            border: 2px solid #5a5a8a;
            padding: 8px 15px;
            pointer-events: auto;
        }

        .hud-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #e0e0e0;
            font-size: 14px;
        }

        .hud-icon {
            width: 20px;
            height: 20px;
            border-radius: 3px;
        }

        .gold-icon { background: #ffd700; }
        .exp-icon { background: #9b59b6; }
        .level-icon { background: #3498db; }
        .stamina-icon { background: #e74c3c; }

        #shop-panel {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 420px;
            max-height: 80%;
            overflow-y: auto;
        }

        #inventory-panel {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            max-height: 80%;
            overflow-y: auto;
        }

        .panel-title {
            font-size: 20px;
            color: #ffd700;
            text-align: center;
            margin-bottom: 15px;
            text-shadow: 2px 2px #000;
        }

        .shop-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }

        .shop-tab {
            flex: 1;
            padding: 8px;
            background: #3a3a5a;
            border: 2px solid #5a5a8a;
            color: #b0b0c0;
            cursor: pointer;
            text-align: center;
            font-size: 13px;
        }

        .shop-tab.active {
            background: #5a5a8a;
            color: #fff;
        }

        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin: 5px 0;
            background: #2a2a4a;
            border: 2px solid #4a4a6a;
            cursor: pointer;
        }

        .shop-item:hover {
            background: #3a3a6a;
            border-color: #7a7aaa;
        }

        .item-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .item-name {
            color: #e0e0e0;
            font-size: 14px;
        }

        .item-desc {
            color: #9090a0;
            font-size: 11px;
        }

        .item-price {
            color: #ffd700;
            font-size: 14px;
        }

        .item-quantity {
            color: #7f8c8d;
            font-size: 12px;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 25px;
            height: 25px;
            background: #e74c3c;
            border: 2px solid #c0392b;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            line-height: 20px;
            text-align: center;
        }

        .close-btn:hover {
            background: #c0392b;
        }

        .btn {
            padding: 10px 20px;
            background: #3498db;
            border: 2px solid #2980b9;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }

        .btn:hover {
            background: #2980b9;
        }

        .btn:disabled {
            background: #555;
            border-color: #444;
            cursor: not-allowed;
        }

        #fishing-game {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            text-align: center;
        }

        #fishing-indicator {
            width: 150px;
            height: 150px;
            margin: 20px auto;
            border: 4px solid #fff;
            border-radius: 50%;
            position: relative;
            background: radial-gradient(circle, #2a2a4a 0%, #1a1a2e 100%);
        }

        #fishing-power {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 70px;
            background: linear-gradient(to top, #e74c3c, #2ecc71);
            transform-origin: bottom center;
            transform: translate(-50%, -100%) rotate(0deg);
        }

        #fishing-target {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 30px;
            height: 30px;
            background: #2ecc71;
            border: 3px solid #27ae60;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .fishing-hint {
            color: #fff;
            font-size: 16px;
            margin-top: 15px;
        }

        .fishing-score {
            font-size: 24px;
            color: #ffd700;
            margin: 10px 0;
        }

        #notification {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            color: #fff;
            text-shadow: 3px 3px #000, -1px -1px #000;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }

        #notification.show {
            opacity: 1;
            animation: bounce 0.5s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.2); }
        }

        .game-tip {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 8px 16px;
            font-size: 13px;
            border-radius: 5px;
            white-space: nowrap;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
        }

        .inv-slot {
            width: 50px;
            height: 50px;
            background: #2a2a4a;
            border: 2px solid #4a4a6a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #b0b0c0;
            position: relative;
            cursor: pointer;
        }

        .inv-slot:hover {
            border-color: #8a8aaa;
            background: #3a3a6a;
        }

        .inv-count {
            position: absolute;
            bottom: 2px;
            right: 3px;
            font-size: 10px;
            color: #ffd700;
        }

        .shop-btn-area {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="960" height="540"></canvas>
        <div id="ui-overlay">
            <div id="hud">
                <div class="hud-item">
                    <div class="hud-icon gold-icon"></div>
                    <span id="gold-display">100</span>
                </div>
                <div class="hud-item">
                    <div class="hud-icon level-icon"></div>
                    <span>Lv.<span id="level-display">1</span></span>
                </div>
                <div class="hud-item">
                    <div class="hud-icon exp-icon"></div>
                    <span><span id="exp-display">0</span>/<span id="exp-max-display">100</span></span>
                </div>
                <div class="hud-item">
                    <div class="hud-icon stamina-icon"></div>
                    <span><span id="stamina-display">100</span></span>
                </div>
                <div style="display:flex;gap:10px;">
                    <button class="btn" onclick="openShop()" style="padding:5px 12px;font-size:12px;">商店 [E]</button>
                    <button class="btn" onclick="openInventory()" style="padding:5px 12px;font-size:12px;">背包 [I]</button>
                </div>
            </div>

            <div id="notification"></div>

            <div id="shop-panel" class="ui-panel">
                <div class="close-btn" onclick="closeShop()">X</div>
                <div class="panel-title">杂货商店</div>
                <div class="shop-tabs">
                    <div class="shop-tab active" onclick="setShopTab('buy')">购买</div>
                    <div class="shop-tab" onclick="setShopTab('sell')">出售</div>
                </div>
                <div id="shop-items"></div>
            </div>

            <div id="inventory-panel" class="ui-panel">
                <div class="close-btn" onclick="closeInventory()">X</div>
                <div class="panel-title">背包</div>
                <div class="inventory-grid" id="inv-grid"></div>
                <div id="inv-details" style="margin-top:15px;color:#b0b0c0;font-size:13px;"></div>
            </div>

            <div id="fishing-game" class="ui-panel">
                <div class="panel-title">钓鱼小游戏!</div>
                <div id="fishing-indicator">
                    <div id="fishing-target"></div>
                    <div id="fishing-power"></div>
                </div>
                <div class="fishing-hint">按 [空格] 停止!</div>
                <div class="fishing-score" id="fishing-score"></div>
                <button class="btn" id="fishing-cancel" onclick="cancelFishing()">取消</button>
            </div>

            <div id="game-tip" class="game-tip" style="display:none;"></div>
        </div>
    </div>

<script>
// ==================== GAME CONSTANTS ====================
const PIXEL_SIZE = 3;
const SCALE = 1;
const CANVAS_W = 320;
const CANVAS_H = 180;

// Colors
const COLORS = {
    sky: '#87ceeb',
    grass1: '#4a7c59',
    grass2: '#8fbc8f',
    grass3: '#3d6b4a',
    water1: '#4a90a4',
    water2: '#6bb3c9',
    water3: '#3a7a94',
    sand: '#c9a66b',
    wood1: '#8b7355',
    wood2: '#d4a574',
    roof: '#a0522d',
    door: '#654321',
    path: '#b8a080',
    player: '#e74c3c',
    playerHair: '#2c1810',
    playerShirt: '#3498db',
    playerPants: '#34495e',
    fish: '#f39c12',
    npc: '#9b59b6',
    npcSkin: '#deb887'
};

// ==================== GAME STATE ====================
const gameState = {
    player: {
        x: 80,
        y: 100,
        dir: 1,
        frame: 0,
        moving: false,
        action: 'idle'
    },
    gold: 100,
    level: 1,
    exp: 0,
    expToLevel: 100,
    stamina: 100,
    maxStamina: 100,
    inventory: [],
    fishingState: 'none',
    fishingTimer: 0,
    hookTimer: 0,
    inMiniGame: false,
    miniGamePower: 0,
    miniGameDir: 1,
    miniGameTarget: 0,
    miniGameSuccess: false,
    shopOpen: false,
    shopTab: 'buy',
    inventoryOpen: false,
    selectedInvSlot: -1,
    npc: { x: 50, y: 95 }
};

const ITEMS = {
    bait_basic: { name: '基础饵', desc: '普通上钩率', price: 10, type: 'bait', effect: 1 },
    bait_adv: { name: '高级饵', desc: '提高上钩率', price: 50, type: 'bait', effect: 1.5 },
    bait_super: { name: '超级饵', desc: '极高上钩率', price: 200, type: 'bait', effect: 2 },
    rod_basic: { name: '新手竿', desc: '+5%成功率', price: 100, type: 'rod', effect: 0.05 },
    rod_adv: { name: '进阶竿', desc: '+15%成功率', price: 500, type: 'rod', effect: 0.15 },
    rod_master: { name: '大师竿', desc: '+30%成功率', price: 2000, type: 'rod', effect: 0.30 },
    potion_stamina: { name: '体力药水', desc: '恢复50体力', price: 30, type: 'potion', restore: 50 },
    charm_lucky: { name: '幸运符', desc: '10秒幸运加成', price: 100, type: 'charm', duration: 600 }
};

const FISH = {
    small: { name: '小鱼', minLevel: 1, weight: 50, basePrice: 5, exp: 10 },
    perch: { name: '河鲈', minLevel: 3, weight: 30, basePrice: 15, exp: 25 },
    carp: { name: '鲤鱼', minLevel: 5, weight: 15, basePrice: 50, exp: 50 },
    goldfish: { name: '金鱼', minLevel: 8, weight: 4, basePrice: 100, exp: 100 },
    legendary: { name: '传说鱼', minLevel: 15, weight: 1, basePrice: 500, exp: 500 }
};

// ==================== CANVAS SETUP ====================
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// Disable right-click menu
canvas.addEventListener('contextmenu', e => e.preventDefault());

// ==================== INPUT HANDLING ====================
const keys = {};
document.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space') {
        e.preventDefault();
        handleSpacePress();
    }
    if (e.code === 'KeyE') handleInteraction();
    if (e.code === 'KeyI') toggleInventory();
    if (e.code === 'Escape') {
        closeShop();
        closeInventory();
        cancelFishing();
    }
});
document.addEventListener('keyup', e => keys[e.code] = false);

function handleSpacePress() {
    if (gameState.fishingState === 'waiting') {
        gameState.hookTimer = 90; // 1.5 seconds at 60fps
        gameState.fishingState = 'bite';
        showNotification('！上钩了！快按空格！', '#2ecc71');
    } else if (gameState.fishingState === 'bite') {
        if (gameState.hookTimer > 0) {
            startMiniGame();
        }
    } else if (gameState.inMiniGame) {
        stopMiniGame();
    }
}

function handleInteraction() {
    const p = gameState.player;
    const npc = gameState.npc;
    const dist = Math.abs(p.x - npc.x) + Math.abs(p.y - npc.y);

    if (dist < 30) {
        openShop();
    } else if (p.x > 200) {
        startFishing();
    }
}

function toggleInventory() {
    if (gameState.inventoryOpen) {
        closeInventory();
    } else {
        openInventory();
    }
}

// ==================== FISHING LOGIC ====================
function startFishing() {
    if (gameState.fishingState !== 'none') return;
    if (gameState.stamina < 10) {
        showNotification('体力不足!', '#e74c3c');
        return;
    }

    gameState.player.action = 'fishing';
    gameState.stamina -= 10;
    gameState.fishingState = 'waiting';
    gameState.fishingTimer = 180 + Math.random() * 720; // 3-15 sec
    updateHUD();
}

function updateFishing() {
    if (gameState.fishingState === 'waiting') {
        gameState.fishingTimer--;
        if (gameState.fishingTimer <= 0) {
            gameState.fishingState = 'bite';
            gameState.hookTimer = 90;
            showNotification('！上钩了！', '#f39c12');
        }
    } else if (gameState.fishingState === 'bite') {
        gameState.hookTimer--;
        if (gameState.hookTimer <= 0) {
            showNotification('鱼跑了...', '#e74c3c');
            endFishing();
        }
    } else if (gameState.inMiniGame) {
        updateMiniGame();
    }
}

function startMiniGame() {
    gameState.inMiniGame = true;
    gameState.miniGamePower = 0;
    gameState.miniGameDir = 1;
    gameState.miniGameTarget = 30 + Math.random() * 240;
    gameState.fishingState = 'mini';
    document.getElementById('fishing-game').classList.add('active');
    document.getElementById('fishing-score').textContent = '';
}

function updateMiniGame() {
    gameState.miniGamePower += 3 * gameState.miniGameDir;
    if (gameState.miniGamePower >= 360) gameState.miniGameDir = -1;
    if (gameState.miniGamePower <= 0) gameState.miniGameDir = 1;

    const power = document.getElementById('fishing-power');
    power.style.transform = `translate(-50%, -100%) rotate(${gameState.miniGamePower}deg)`;
}

function stopMiniGame() {
    if (!gameState.inMiniGame) return;

    gameState.inMiniGame = false;
    document.getElementById('fishing-game').classList.remove('active');

    // Check if in target zone
    const normalizedPower = gameState.miniGamePower % 360;
    const targetStart = gameState.miniGameTarget;
    const targetEnd = (targetStart + 60) % 360;

    let success = false;
    if (targetStart < targetEnd) {
        success = normalizedPower >= targetStart && normalizedPower <= targetEnd;
    } else {
        success = normalizedPower >= targetStart || normalizedPower <= targetEnd;
    }

    if (success) {
        catchFish();
    } else {
        showNotification('失败了...', '#e74c3c');
        endFishing();
    }
}

function cancelFishing() {
    gameState.inMiniGame = false;
    document.getElementById('fishing-game').classList.remove('active');
    endFishing();
}

function endFishing() {
    gameState.fishingState = 'none';
    gameState.player.action = 'idle';
}

function catchFish() {
    // Roll for fish type based on level and weight
    const roll = Math.random() * 100;
    let cumulative = 0;
    let caughtFish = FISH.small;

    for (const [key, fish] of Object.entries(FISH)) {
        if (gameState.level >= fish.minLevel) {
            cumulative += fish.weight;
            if (roll < cumulative) {
                caughtFish = fish;
                break;
            }
        }
    }

    // Add to inventory
    addToInventory(caughtFish.name, 1, 'fish');

    // Gain exp
    gainExp(caughtFish.exp);

    showNotification(`钓到了 ${caughtFish.name}!`, '#2ecc71');
    document.getElementById('fishing-score').textContent = `+${caughtFish.exp} EXP`;

    setTimeout(endFishing, 1500);
}

function gainExp(amount) {
    gameState.exp += amount;
    while (gameState.exp >= gameState.expToLevel) {
        gameState.exp -= gameState.expToLevel;
        gameState.level++;
        gameState.expToLevel = Math.floor(100 * Math.pow(1.2, gameState.level - 1));
        showNotification(`升级了! Lv.${gameState.level}`, '#9b59b6');
    }
    updateHUD();
}

// ==================== INVENTORY SYSTEM ====================
function addToInventory(name, qty, type) {
    // Check existing stack
    for (let i = 0; i < gameState.inventory.length; i++) {
        const slot = gameState.inventory[i];
        if (slot && slot.name === name) {
            slot.qty += qty;
            updateInventoryUI();
            return true;
        }
    }

    // Find empty slot
    if (gameState.inventory.length >= 20) {
        showNotification('背包满了!', '#e74c3c');
        return false;
    }

    gameState.inventory.push({ name, qty, type });
    updateInventoryUI();
    return true;
}

function removeFromInventory(name, qty) {
    for (let i = 0; i < gameState.inventory.length; i++) {
        const slot = gameState.inventory[i];
        if (slot && slot.name === name) {
            slot.qty -= qty;
            if (slot.qty <= 0) {
                gameState.inventory.splice(i, 1);
            }
            updateInventoryUI();
            return true;
        }
    }
    return false;
}

function hasItem(name) {
    return gameState.inventory.some(s => s && s.name === name);
}

function updateInventoryUI() {
    const grid = document.getElementById('inv-grid');
    grid.innerHTML = '';

    for (let i = 0; i < 20; i++) {
        const slot = gameState.inventory[i];
        const div = document.createElement('div');
        div.className = 'inv-slot';
        div.onclick = () => selectInvSlot(i);

        if (slot) {
            div.innerHTML = `<span>${slot.name}</span><span class="inv-count">x${slot.qty}</span>`;
        }

        grid.appendChild(div);
    }
}

function selectInvSlot(index) {
    gameState.selectedInvSlot = index;
    const details = document.getElementById('inv-details');
    const slot = gameState.inventory[index];

    if (slot) {
        let info = `<strong>${slot.name}</strong> x${slot.qty}<br>`;

        if (slot.type === 'fish') {
            const fishData = Object.values(FISH).find(f => f.name === slot.name);
            if (fishData) {
                info += `价值: ${fishData.basePrice} 金 | EXP: ${fishData.exp}`;
            }
        } else if (ITEMS[slot.name]) {
            info += ITEMS[slot.name].desc;
        }

        details.innerHTML = info;
    } else {
        details.innerHTML = '';
    }
}

function openInventory() {
    gameState.inventoryOpen = true;
    updateInventoryUI();
    document.getElementById('inventory-panel').classList.add('active');
}

function closeInventory() {
    gameState.inventoryOpen = false;
    document.getElementById('inventory-panel').classList.remove('active');
}

// ==================== SHOP SYSTEM ====================
const SHOP_BUY_ITEMS = [
    { ...ITEMS.bait_basic },
    { ...ITEMS.bait_adv },
    { ...ITEMS.bait_super },
    { ...ITEMS.rod_basic },
    { ...ITEMS.rod_adv },
    { ...ITEMS.rod_master },
    { ...ITEMS.potion_stamina },
    { ...ITEMS.charm_lucky }
];

function openShop() {
    gameState.shopOpen = true;
    gameState.shopTab = 'buy';
    document.querySelectorAll('.shop-tab').forEach(t => t.classList.remove('active'));
    document.querySelector('.shop-tab').classList.add('active');
    renderShopItems();
    document.getElementById('shop-panel').classList.add('active');
}

function closeShop() {
    gameState.shopOpen = false;
    document.getElementById('shop-panel').classList.remove('active');
}

function setShopTab(tab) {
    gameState.shopTab = tab;
    document.querySelectorAll('.shop-tab').forEach(t => t.classList.remove('active'));
    document.querySelector(`.shop-tab:nth-child(${tab === 'buy' ? 1 : 2})`).classList.add('active');
    renderShopItems();
}

function renderShopItems() {
    const container = document.getElementById('shop-items');

    if (gameState.shopTab === 'buy') {
        container.innerHTML = SHOP_BUY_ITEMS.map(item => `
            <div class="shop-item" onclick="buyItem('${item.name}')">
                <div class="item-info">
                    <span class="item-name">${item.name}</span>
                    <span class="item-desc">${item.desc}</span>
                </div>
                <span class="item-price">${item.price}金</span>
            </div>
        `).join('');
    } else {
        // Sell tab - show inventory items that can be sold
        const sellable = gameState.inventory.filter(s => s.type === 'fish' || ITEMS[s.name]);
        if (sellable.length === 0) {
            container.innerHTML = '<div style="color:#666;text-align:center;padding:20px;">背包里没有可出售的物品</div>';
        } else {
            container.innerHTML = sellable.map((slot, i) => {
                let price = 5;
                if (slot.type === 'fish') {
                    const fishData = Object.values(FISH).find(f => f.name === slot.name);
                    if (fishData) price = fishData.basePrice;
                } else if (ITEMS[slot.name]) {
                    price = Math.floor(ITEMS[slot.name].price * 0.5);
                }
                const realIndex = gameState.inventory.indexOf(slot);
                return `
                    <div class="shop-item" onclick="sellItem(${realIndex}, ${price})">
                        <div class="item-info">
                            <span class="item-name">${slot.name}</span>
                            <span class="item-quantity">x${slot.qty}</span>
                        </div>
                        <span class="item-price">+${price}金</span>
                    </div>
                `;
            }).join('');
        }
    }
}

function buyItem(name) {
    const item = SHOP_BUY_ITEMS.find(i => i.name === name);
    if (!item) return;

    if (gameState.gold < item.price) {
        showNotification('金币不足!', '#e74c3c');
        return;
    }

    if (item.type === 'potion') {
        if (gameState.stamina >= gameState.maxStamina) {
            showNotification('体力已满!', '#e74c3c');
            return;
        }
        gameState.stamina = Math.min(gameState.maxStamina, gameState.stamina + item.restore);
    } else {
        if (!addToInventory(item.name, 1, item.type)) {
            return;
        }
    }

    gameState.gold -= item.price;
    updateHUD();
    showNotification(`购买了 ${item.name}!`, '#2ecc71');
    renderShopItems();
}

function sellItem(index, price) {
    const slot = gameState.inventory[index];
    if (!slot) return;

    gameState.gold += price * slot.qty;
    gameState.inventory.splice(index, 1);
    updateHUD();
    renderShopItems();
    showNotification(`出售获得 ${price * slot.qty} 金!`, '#f39c12');
}

// ==================== PLAYER MOVEMENT ====================
function updatePlayer() {
    if (gameState.shopOpen || gameState.inventoryOpen) {
        gameState.player.moving = false;
        return;
    }
    if (gameState.fishingState !== 'none' && gameState.fishingState !== 'waiting' && gameState.fishingState !== 'bite') return;

    const p = gameState.player;
    let dx = 0, dy = 0;

    if (keys['ArrowLeft'] || keys['KeyA']) dx = -1;
    if (keys['ArrowRight'] || keys['KeyD']) dx = 1;
    if (keys['ArrowUp'] || keys['KeyW']) dy = -1;
    if (keys['ArrowDown'] || keys['KeyS']) dy = 1;

    if (dx !== 0 || dy !== 0) {
        p.moving = true;
        p.dir = dx !== 0 ? dx : p.dir;
        p.frame = (p.frame + 0.15) % 4;

        const newX = p.x + dx * 1.5;
        const newY = p.y + dy * 1.5;

        // Bounds checking
        if (newX >= 10 && newX <= 310) p.x = newX;
        if (newY >= 50 && newY <= 140) p.y = newY;

        if (p.action !== 'fishing') {
            p.action = 'walk';
        }
    } else {
        p.moving = false;
        p.frame = 0;
        if (p.action !== 'fishing') {
            p.action = 'idle';
        }
    }
}

// ==================== RENDERING ====================
function drawPixel(x, y, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x * PIXEL_SIZE * SCALE, y * PIXEL_SIZE * SCALE, PIXEL_SIZE * SCALE, PIXEL_SIZE * SCALE);
}

function drawRect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x * PIXEL_SIZE * SCALE, y * PIXEL_SIZE * SCALE, w * PIXEL_SIZE * SCALE, h * PIXEL_SIZE * SCALE);
}

function render() {
    // Clear
    ctx.fillStyle = COLORS.sky;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Ground/grass
    for (let x = 0; x < CANVAS_W; x++) {
        for (let y = 100; y < 140; y++) {
            const noise = Math.sin(x * 0.1) * Math.cos(y * 0.1);
            const color = noise > 0 ? COLORS.grass1 : COLORS.grass2;
            drawPixel(x, y, color);
        }
    }

    // Path
    for (let x = 30; x < 80; x++) {
        for (let y = 110; y < 135; y++) {
            drawPixel(x, y, COLORS.path);
        }
    }

    // Water
    for (let x = 200; x < CANVAS_W; x++) {
        for (let y = 95; y < CANVAS_H; y++) {
            const wave = Math.sin(x * 0.2 + Date.now() * 0.003) * 0.5;
            const color = (x + y + wave * 5) % 3 === 0 ? COLORS.water1 : COLORS.water2;
            drawPixel(x, y, color);
        }
    }

    // Water edge foam
    for (let x = 200; x < CANVAS_W; x++) {
        drawPixel(x, 95, '#c9e4ca');
        if (x % 4 === 0) drawPixel(x, 94, '#c9e4ca');
    }

    // Shop building
    // Base
    drawRect(30, 70, 50, 30, COLORS.wood1);
    drawRect(32, 72, 46, 26, COLORS.wood2);
    // Roof
    for (let i = 0; i < 6; i++) {
        drawRect(25 - i, 65 + i, 60 + i * 2, 2, COLORS.roof);
    }
    // Door
    drawRect(50, 85, 10, 15, COLORS.door);
    // Sign
    ctx.fillStyle = '#f5deb3';
    ctx.font = '12px monospace';
    ctx.fillText('杂货店', 38 * PIXEL_SIZE * SCALE, 78 * PIXEL_SIZE * SCALE);

    // NPC
    drawNPC(gameState.npc.x, gameState.npc.y);

    // Player
    drawPlayer(gameState.player);

    // Fishing rod if fishing
    if (gameState.player.action === 'fishing' || gameState.fishingState !== 'none') {
        drawFishingRod();
    }

    // Fishing bobber in water
    if (gameState.fishingState === 'waiting' || gameState.fishingState === 'bite') {
        const bobberX = gameState.player.x + 20;
        const bobberY = 100;
        const bob = gameState.fishingState === 'bite';
        drawRect(bobberX, bobberY, 3, 3, bob ? '#e74c3c' : '#fff');
        if (bob) {
            // Bounce animation
            const bounce = Math.sin(Date.now() * 0.02) * 2;
            drawRect(bobberX - 1, bobberY - 5 + bounce, 5, 3, '#e74c3c');
        }
    }

    // Waiting dots animation
    if (gameState.fishingState === 'waiting') {
        const dots = '.'.repeat(Math.floor(Date.now() / 500) % 4);
        ctx.fillStyle = '#fff';
        ctx.font = '14px monospace';
        ctx.fillText(`等待中${dots}`, 260 * PIXEL_SIZE * SCALE, 50 * PIXEL_SIZE * SCALE);
    }

    // Bite warning
    if (gameState.fishingState === 'bite') {
        ctx.fillStyle = '#e74c3c';
        ctx.font = '16px monospace';
        ctx.fillText(`按空格! ${Math.ceil(gameState.hookTimer / 60)}s`, 250 * PIXEL_SIZE * SCALE, 50 * PIXEL_SIZE * SCALE);
    }

    // Show interaction hint near shop
    const p = gameState.player;
    const npc = gameState.npc;
    if (Math.abs(p.x - npc.x) + Math.abs(p.y - npc.y) < 30 && !gameState.shopOpen) {
        showTip('按 [E] 进入商店');
    } else if (p.x > 200 && gameState.fishingState === 'none') {
        showTip('按 [E] 或 空格 开始钓鱼');
    } else {
        hideTip();
    }
}

function drawPlayer(pl) {
    const x = Math.floor(pl.x);
    const y = Math.floor(pl.y);
    const bounce = pl.moving ? Math.sin(pl.frame * Math.PI) * 2 : 0;
    const dir = pl.dir;

    // Shadow
    drawRect(x - 4, y + 12, 8, 3, 'rgba(0,0,0,0.3)');

    // Legs
    const legOffset = pl.moving ? Math.sin(pl.frame * Math.PI * 2) * 2 : 0;
    drawRect(x - 3, y + 8 + bounce, 3, 5, COLORS.playerPants);
    drawRect(x + 1, y + 8 + bounce + legOffset, 3, 5, COLORS.playerPants);

    // Body
    drawRect(x - 4, y + 2 + bounce, 8, 7, COLORS.playerShirt);

    // Head
    drawRect(x - 3, y - 4 + bounce, 7, 7, '#ffd5b5');

    // Hair
    drawRect(x - 4, y - 5 + bounce, 8, 4, COLORS.playerHair);
    if (dir < 0) {
        drawRect(x - 5, y - 4 + bounce, 2, 4, COLORS.playerHair);
    }

    // Eyes
    const eyeX = dir > 0 ? 2 : -2;
    drawPixel(x + eyeX + 1, y - 1 + bounce, '#000');
    drawPixel(x + eyeX + 4, y - 1 + bounce, '#000');

    // Arms
    if (pl.action === 'fishing') {
        // Fishing pose - arm extended
        drawRect(x + dir * 5, y + 3 + bounce, 8 * dir, 3, '#ffd5b5');
    } else {
        const armSwing = pl.moving ? Math.sin(pl.frame * Math.PI * 2) * 2 : 0;
        drawRect(x - 6, y + 3 + bounce + armSwing, 3, 5, '#ffd5b5');
        drawRect(x + 3, y + 3 + bounce - armSwing, 3, 5, '#ffd5b5');
    }
}

function drawNPC(x, y) {
    // Shadow
    drawRect(x - 4, y + 12, 8, 3, 'rgba(0,0,0,0.3)');

    // Legs
    drawRect(x - 3, y + 8, 3, 5, '#5a4a3a');
    drawRect(x + 1, y + 8, 3, 5, '#5a4a3a');

    // Body
    drawRect(x - 4, y + 2, 8, 7, COLORS.npc);

    // Head
    drawRect(x - 3, y - 4, 7, 7, COLORS.npcSkin);

    // Hair
    drawRect(x - 4, y - 5, 8, 4, '#4a3728');

    // Eyes
    drawPixel(x, y - 1, '#000');
    drawPixel(x + 4, y - 1, '#000');

    // "!" indicator
    if (Math.abs(gameState.player.x - x) + Math.abs(gameState.player.y - y) < 30) {
        ctx.fillStyle = '#ffd700';
        ctx.font = '12px monospace';
        ctx.fillText('!', (x - 2) * PIXEL_SIZE * SCALE, (y - 15) * PIXEL_SIZE * SCALE);
    }
}

function drawFishingRod() {
    const p = gameState.player;
    const x = p.x + (p.dir > 0 ? 8 : -8);
    const y = p.y + 3;

    // Rod
    ctx.strokeStyle = '#8b4513';
    ctx.lineWidth = 3 * SCALE;
    ctx.beginPath();
    ctx.moveTo(x * PIXEL_SIZE * SCALE, y * PIXEL_SIZE * SCALE);
    ctx.lineTo((x + p.dir * 25) * PIXEL_SIZE * SCALE, (y - 15) * PIXEL_SIZE * SCALE);
    ctx.stroke();

    // Line
    ctx.strokeStyle = '#ccc';
    ctx.lineWidth = 1 * SCALE;
    ctx.beginPath();
    ctx.moveTo((x + p.dir * 25) * PIXEL_SIZE * SCALE, (y - 15) * PIXEL_SIZE * SCALE);
    ctx.lineTo((x + p.dir * 40) * PIXEL_SIZE * SCALE, (y + 20) * PIXEL_SIZE * SCALE);
    ctx.stroke();
}

// ==================== UI HELPERS ====================
function showNotification(text, color) {
    const notif = document.getElementById('notification');
    notif.textContent = text;
    notif.style.color = color;
    notif.classList.add('show');
    setTimeout(() => notif.classList.remove('show'), 2000);
}

function showTip(text) {
    const tip = document.getElementById('game-tip');
    tip.textContent = text;
    tip.style.display = 'block';
}

function hideTip() {
    document.getElementById('game-tip').style.display = 'none';
}

function updateHUD() {
    document.getElementById('gold-display').textContent = gameState.gold;
    document.getElementById('level-display').textContent = gameState.level;
    document.getElementById('exp-display').textContent = gameState.exp;
    document.getElementById('exp-max-display').textContent = gameState.expToLevel;
    document.getElementById('stamina-display').textContent = gameState.stamina;
}

// ==================== GAME LOOP ====================
function gameLoop() {
    updatePlayer();
    updateFishing();
    render();
    requestAnimationFrame(gameLoop);
}

// ==================== INITIALIZATION ====================
function init() {
    updateHUD();
    gameLoop();
}

init();
</script>
