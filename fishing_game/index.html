<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素钓鱼 - Pixel Fishing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
        }

        #gameCanvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background: #87CEEB;
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .dialog-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            background: rgba(0, 0, 0, 0.85);
            border: 4px solid #fff;
            border-radius: 8px;
            padding: 20px;
            color: #fff;
            font-size: 16px;
            line-height: 1.6;
            display: none;
            pointer-events: auto;
        }

        .dialog-box.active {
            display: block;
        }

        .dialog-title {
            color: #FFD700;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .dialog-text {
            color: #fff;
        }

        .hud {
            position: absolute;
            top: 10px;
            left: 10px;
            display: flex;
            gap: 20px;
        }

        .hud-item {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #fff;
            border-radius: 4px;
            padding: 8px 16px;
            color: #fff;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hud-icon {
            width: 20px;
            height: 20px;
            image-rendering: pixelated;
        }

        .controls-hint {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 10px 15px;
            border-radius: 4px;
            font-size: 12px;
            line-height: 1.8;
        }

        .fishing-ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
        }

        .fishing-ui.active {
            display: block;
        }

        .fishing-bar {
            width: 30px;
            height: 300px;
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid #fff;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
        }

        .fishing-zone {
            position: absolute;
            width: 100%;
            background: linear-gradient(to bottom, #90EE90, #32CD32, #90EE90);
            border-radius: 10px;
        }

        .fishing-cursor {
            position: absolute;
            width: 100%;
            height: 30px;
            background: #FFD700;
            border: 2px solid #fff;
            border-radius: 5px;
            transition: top 0.1s;
        }

        .start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .start-screen.hidden {
            display: none;
        }

        .game-title {
            font-size: 48px;
            color: #FFD700;
            text-shadow: 4px 4px 0 #000;
            margin-bottom: 20px;
            letter-spacing: 4px;
        }

        .game-subtitle {
            font-size: 18px;
            color: #87CEEB;
            margin-bottom: 40px;
        }

        .start-btn {
            background: #32CD32;
            color: #fff;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
            font-weight: bold;
        }

        .start-btn:hover {
            transform: scale(1.05);
        }

        .inventory {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            background: rgba(0, 0, 0, 0.95);
            border: 4px solid #fff;
            border-radius: 8px;
            padding: 20px;
            display: none;
            pointer-events: auto;
        }

        .inventory.active {
            display: block;
        }

        .inventory-title {
            color: #FFD700;
            font-size: 20px;
            text-align: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #555;
            padding-bottom: 10px;
        }

        .fish-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .fish-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #333;
            color: #fff;
        }

        .fish-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .fish-icon {
            width: 40px;
            height: 40px;
            margin-right: 15px;
            image-rendering: pixelated;
        }

        .fish-info {
            flex: 1;
        }

        .fish-name {
            font-weight: bold;
            color: #87CEEB;
        }

        .fish-rarity {
            font-size: 12px;
            color: #888;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
        }

        .notification {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            border: 3px solid #FFD700;
            border-radius: 8px;
            padding: 15px 30px;
            color: #FFD700;
            font-size: 18px;
            font-weight: bold;
            display: none;
        }

        .notification.active {
            display: block;
            animation: fadeInOut 3s ease-in-out;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
            10%, 90% { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <!-- 开始界面 -->
        <div class="start-screen" id="startScreen">
            <h1 class="game-title">🎣 像素钓鱼</h1>
            <p class="game-subtitle">Pixel Fishing Adventure</p>
            <button class="start-btn" onclick="startGame()">开始游戏</button>
        </div>

        <!-- UI 层 -->
        <div class="ui-overlay">
            <div class="hud">
                <div class="hud-item">
                    <span>🎒</span>
                    <span id="fishCount">0</span>
                </div>
                <div class="hud-item">
                    <span>💰</span>
                    <span id="money">0</span>
                </div>
                <div class="hud-item">
                    <span>⭐</span>
                    <span id="level">Lv.1</span>
                </div>
            </div>

            <!-- 钓鱼小游戏UI -->
            <div class="fishing-ui" id="fishingUI">
                <div class="fishing-bar">
                    <div class="fishing-zone" id="fishingZone"></div>
                    <div class="fishing-cursor" id="fishingCursor"></div>
                </div>
            </div>

            <!-- 对话框 -->
            <div class="dialog-box" id="dialogBox">
                <div class="dialog-title" id="dialogTitle">提示</div>
                <div class="dialog-text" id="dialogText"></div>
            </div>

            <!-- 背包 -->
            <div class="inventory" id="inventory">
                <span class="close-btn" onclick="closeInventory()">×</span>
                <div class="inventory-title">🎒 我的收获</div>
                <div class="fish-list" id="fishList"></div>
            </div>

            <!-- 通知 -->
            <div class="notification" id="notification"></div>

            <!-- 操作提示 -->
            <div class="controls-hint">
                <div>WASD / 方向键 - 移动</div>
                <div>空格键 - 互动/钓鱼</div>
                <div>B - 打开背包</div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
